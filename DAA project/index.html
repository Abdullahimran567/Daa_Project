<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AlgoLab — an interactive workbench for the Closest Pair of Points and Karatsuba multiplication algorithms."
    />
    <meta name="theme-color" content="#05070e" />
    <title>AlgoLab · Algorithm Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        background: #05070e;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05070e;
        z-index: 999;
        transition: opacity 0.6s ease 0.1s, visibility 0.6s;
      }
      #boot[data-done="1"] {
        opacity: 0;
        visibility: hidden;
      }
      #boot span {
        width: 120px;
        height: 2px;
        border-radius: 999px;
        background: #1a2134;
        overflow: hidden;
        position: relative;
      }
      #boot span::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #8fb6ff, #5ff0d8, transparent);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span></span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
